<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible-box</title>
    <style>
        div.container{
            background-color: darkgoldenrod;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            flex-basis: 250px;
            
            flex-grow: 1; /* Vai ocupar o container inteiro*/
            /*flex-shrink: 0; N vai encolher */
        }

        /*#b{
            flex-grow: 1;
        } só o B que vai esticar*/

        #a{
            flex-basis: 150px;
            flex-grow: 0; /* N vai crescer */
            flex-shrink: 1;
        }

        #b{
            flex-basis: 150px;
            flex-grow: 2; /* Vai crescer o dobro*/
            flex-shrink: 0;
        }

        #c{
            flex-basis: 150px;
            flex-grow: 1;
            flex-shrink: 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="a">A</div>
        <div class="item" id="b">B</div>
        <div class="item" id="c">C</div>
    </div>
</body>
</html>
