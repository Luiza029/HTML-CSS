<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0;
            padding: 0;
        }

        .pai{
            background-color: darkred;
            height: 100vh;
            width: 100vw;

            /* Para centralizar a caixa azul no centro */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .filho{
            background-color: darkblue;
            width: 400px;
            height: 400px;
            border-radius: 20px;
            color: white;

            /* Para centralizar o texto dentro da caixa azul*/
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
        }
    </style>
</head>
<body>
    <div class="pai">
        <div class="filho">
            <p>Centro</p>
        </div>
    </div>
</body>
</html>
