<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio Grid-Layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .container{
            display: grid;
            height: 100vh;
            width: 100vw;
            grid-template-rows: 80px 40px 1fr 40px; /* Os que vão se adaptar com o tamanho, usa fr*/
            grid-template-columns: 1fr 150px;
            gap: 5px;
            text-align: center;
            
        }

        .caixa1{
            background-color: lightpink;
            grid-row: 1 / 2;
            grid-column: 1 / 3;
        }

        .caixa2{
            background-color: lightblue;
            grid-row: 2 / 3;
            grid-column: 1 /3;
        }

        .caixa3{
            background-color: lightgreen;
            grid-row: 3 / -2;
            grid-column: 1 / 2;
        }

        .caixa4{
            background-color: lightsalmon;
            grid-row: 3 / 4;
        }

        .caixa5{
            background-color: lightseagreen;
            grid-column: 1 / 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa1">Topo</div>
        <div class="caixa2">Menu</div>
        <div class="caixa3">Principal</div>
        <div class="caixa4">Secundario</div>
        <div class="caixa5">Rodape</div>
    </div>
</body>
</html>
