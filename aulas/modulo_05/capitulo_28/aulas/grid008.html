<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Areas</title>
    <style>
        .container{
            display: grid;
            grid-template-rows: repeat(3,100px);
            grid-template-columns: repeat(4, 1fr);
        }
        /* Shorthand */

        .caixa1{
            background-color: lightblue;
            /*grid-row-start: 1;
            grid-row-end: 2;
            grid-column-start: 1;
            grid-column-end: 5;*/

            /*grid-row: 1/2;
            grid-column: 1/5;*/

            grid-area: 1 / 1 / 2 / 5;
        }

        .caixa2{
            background-color: lightpink;
            /*grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 1;
            grid-column-end: 3;*/

            /*grid-row: 2/4;
            grid-column: 1/3;*/

            grid-area: 2 / 1 / 4 / 3;
        }

        .caixa3{
            background-color: lightgreen;
            /*grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 5;*/

            /*grid-row: 2/4;
            grid-column: 3/5;*/

            grid-area: 2 / 3 / 4 / 5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa1">Caixa 01</div>
        <div class="caixa2">Caixa 02</div>
        <div class="caixa3">Caixa 03</div>
    </div>
</body>
</html>
